services:
  - type: web
    name: taskflow
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: TASKFLOW_START_WORKERS
        value: "true"
      - key: WORKER_COUNT
        value: "2"
      - key: TASKFLOW_DB
        value: /tmp/taskflow.db
